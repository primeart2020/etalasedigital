<!-- 1. Kirim ulang daftar produk baru -->
{% include 'katalog/partials/product_cards.html' %}

<!-- 2. Jalankan OOB Swap untuk Tombol Filter Mobile kamu -->
<button id="filter-button-element" 
        hx-swap-oob="true" 
        class="btn btn-sm {% if request.GET.category or request.GET.min_price or request.GET.max_price %}btn-danger{% else %}btn-outline-dark{% endif %} d-lg-none position-relative" 
        data-bs-target="#filterModal" 
        data-bs-toggle="modal">
    <i class="fas fa-filter"></i> Filter
    
    {% if request.GET.category or request.GET.min_price or request.GET.max_price %}
    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark border border-white" style="font-size: 0.6rem;">
        <i class="fas fa-check"></i>
    </span>
    {% endif %}
</button>

<!-- 3. Jalankan OOB Swap untuk Sidebar Kategori Desktop agar centangnya tidak lepas! -->
<div id="desktop-category-sidebar" hx-swap-oob="true">
    {% for cat in categories %}
    <li class="list-group-item d-flex justify-content-between align-items-center px-0">
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="category" value="{{ cat.id }}"
                hx-get="{% url 'store' %}" hx-target="#product-list" hx-trigger="change"
                hx-include="[name='q'], [name='sort']"
                {% if cat.id|stringformat:"i" in request.GET.getlist %}checked{% endif %}> <!-- Menjaga status centang -->
            <label class="form-check-label">{{ cat.name }}</label>
        </div>
    </li>
    {% endfor %}
</div>
